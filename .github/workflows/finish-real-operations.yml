name: Finish real operations
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish employee, jornada, notifications and password UX
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); changed=False
          # Sync real Supabase employees into the operational employee registry.
          if 'syncAuthEmployeeIntoDb' not in s:
              marker="async function login(ev){"
              fn="""async function syncAuthEmployeeIntoDb(){if(!currentUser||!['FUNCIONARIO','SUPERVISOR'].includes(currentRole))return false;db.employees=db.employees||[];let email=String(currentUser.email||'').toLowerCase(),x=db.employees.find(v=>String(v.email||'').toLowerCase()===email);if(!x){x={id:'AUTH-'+String(currentUser.id||email).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,48)};db.employees.push(x)}let before=JSON.stringify(x);Object.assign(x,{name:currentUser.displayName||currentUser.name||email,role:currentRole,email,active:true});currentUser.employeeId=x.id;sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));return before!==JSON.stringify(x)}
"""
              if marker not in s: raise SystemExit('LOGIN_MARKER_NOT_FOUND')
              s=s.replace(marker,fn+marker,1); changed=True
          # Add sync after cloud hydration in both login and restore paths.
          if 'let changed=await syncAuthEmployeeIntoDb();if(changed)save();' not in s:
              s=s.replace('await loadCloudState(false);await initCloudRealtime();return;','await loadCloudState(false);let changed=await syncAuthEmployeeIntoDb();if(changed)save();await initCloudRealtime();return;',1)
              s=s.replace('await loadCloudState(false);await initCloudRealtime();return true;','await loadCloudState(false);let changed=await syncAuthEmployeeIntoDb();if(changed)save();await initCloudRealtime();return true;',1)
              changed=True
          # Robust Admin employee save: update an existing same-email employee instead of losing/duplicating it.
          old="function saveEmployee(id){if(!rpcIsAdmin())return rpcDenyRole(\"Área exclusiva de Administración.\");let x=id?e(id):{id:'E'+Date.now()};Object.assign(x,{name:q('en').value,role:q('er').value,phone:q('ep').value,email:q('ee').value,entry:q('ed').value,active:q('ea').value==='1',notes:q('eo').value,permissions:{services:q('ep_services')?.checked,chat:q('ep_chat')?.checked,quality:q('ep_quality')?.checked,photos:q('ep_photos')?.checked,finance:q('ep_finance')?.checked}});if(!id)db.employees.push(x);audit(id?'Editar funcionario':'Crear funcionario',x.name);save();closeModal();render('employees')}"
          new="function saveEmployee(id){if(!rpcIsAdmin())return rpcDenyRole('Área exclusiva de Administración.');db.employees=db.employees||[];let email=(q('ee')?.value||'').trim().toLowerCase(),x=id?e(id):db.employees.find(v=>String(v.email||'').toLowerCase()===email)||{id:'E'+Date.now()};let isNew=!db.employees.includes(x);Object.assign(x,{name:q('en').value.trim(),role:q('er').value,phone:q('ep').value,email,entry:q('ed').value,active:q('ea').value==='1',notes:q('eo').value,permissions:{services:!!q('ep_services')?.checked,chat:!!q('ep_chat')?.checked,quality:!!q('ep_quality')?.checked,photos:!!q('ep_photos')?.checked,finance:!!q('ep_finance')?.checked}});if(isNew)db.employees.push(x);audit(isNew?'Crear funcionario':'Editar funcionario',x.name);save();closeModal();render('employees');toast(isNew?'Funcionario guardado correctamente.':'Funcionario actualizado correctamente.')}"
          if old in s:s=s.replace(old,new,1);changed=True
          # Real jornada GPS tracking.
          if 'attendanceWatchId' not in s:
              old_in="function clockInSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.find(x=>x.employeeId===id&&!x.out);if(open)return toast('Ya tiene una entrada abierta.');let now=new Date();let rec={employeeId:id,date:todayISO(),inISO:now.toISOString(),in:now.toLocaleString('es-ES'),status:'Trabajando',location:false};let finish=()=>{db.attendance.push(rec);save();render('employee');toast('Entrada registrada correctamente.')};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{rec.location={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};finish()},()=>finish(),{enableHighAccuracy:true,timeout:10000,maximumAge:0});else finish()}"
              new_in="let attendanceWatchId=null,attendanceLastSent=0;function startAttendanceWatch(id){if(attendanceWatchId!==null||!navigator.geolocation)return;attendanceWatchId=navigator.geolocation.watchPosition(pos=>{if(Date.now()-attendanceLastSent<20000)return;attendanceLastSent=Date.now();let rec=(db.attendance||[]).slice().reverse().find(x=>x.employeeId===id&&!x.out);if(!rec)return;let loc={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),accuracy:Math.round(pos.coords.accuracy),at:new Date().toISOString()};rec.location=loc;rec.lastLocation=loc;db.locations=db.locations||[];db.locations.push({employeeId:id,...loc,source:'JORNADA'});if(db.locations.length>5000)db.locations=db.locations.slice(-5000);save()},()=>{}, {enableHighAccuracy:true,maximumAge:10000,timeout:15000})}function stopAttendanceWatch(){if(attendanceWatchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(attendanceWatchId);attendanceWatchId=null}}function clockInSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.find(x=>x.employeeId===id&&!x.out);if(open)return toast('Ya tiene una entrada abierta.');let now=new Date(),rec={employeeId:id,date:todayISO(),inISO:now.toISOString(),in:now.toLocaleString('es-ES'),status:'Trabajando',location:false};let finish=()=>{db.attendance.push(rec);save();render('employee');startAttendanceWatch(id);toast('Entrada registrada correctamente.')};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{rec.location={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),accuracy:Math.round(pos.coords.accuracy),at:new Date().toISOString()};db.locations=db.locations||[];db.locations.push({employeeId:id,...rec.location,source:'JORNADA'});finish()},()=>finish(),{enableHighAccuracy:true,timeout:10000,maximumAge:0});else finish()}"
              if old_in not in s: raise SystemExit('CLOCK_IN_MARKER_NOT_FOUND')
              s=s.replace(old_in,new_in,1); changed=True
              old_out="function clockOutSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.slice().reverse().find(x=>x.employeeId===id&&!x.out);if(!open)return toast('No hay una entrada abierta.');let now=new Date();open.outISO=now.toISOString();open.out=now.toLocaleString('es-ES');open.date=open.date||todayISO();open.status='Finalizado';save();render('employee');toast('Salida registrada correctamente.')}"
              new_out="function clockOutSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.slice().reverse().find(x=>x.employeeId===id&&!x.out);if(!open)return toast('No hay una entrada abierta.');let now=new Date();open.outISO=now.toISOString();open.out=now.toLocaleString('es-ES');open.date=open.date||todayISO();open.status='Finalizado';stopAttendanceWatch();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{open.location={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),accuracy:Math.round(pos.coords.accuracy),at:new Date().toISOString()};db.locations=db.locations||[];db.locations.push({employeeId:id,...open.location,source:'JORNADA_FIN'});save();render('employee');toast('Salida registrada correctamente.')},()=>{save();render('employee');toast('Salida registrada correctamente.')},{enableHighAccuracy:true,timeout:10000,maximumAge:0});else{save();render('employee');toast('Salida registrada correctamente.')}}"
              if old_out not in s: raise SystemExit('CLOCK_OUT_MARKER_NOT_FOUND')
              s=s.replace(old_out,new_out,1); changed=True
          # Password eye on login.
          if 'RPC_PASSWORD_EYE_V1' not in s:
              css="<style id='RPC_PASSWORD_EYE_V1'>.rpcPassWrap{position:relative}.rpcPassWrap .rpcEye{position:absolute;right:8px;bottom:6px;width:36px;height:36px;border:0;background:transparent;color:#7c7065;font-size:18px;padding:0}.rpcPassWrap .field{padding-right:46px}</style>"
              js="<script id='RPC_PASSWORD_EYE_V1'>function rpcTogglePassword(id,b){let x=q(id);if(!x)return;x.type=x.type==='password'?'text':'password';if(b)b.textContent=x.type==='password'?'◉':'◉̸'}function installPasswordEye(){let x=q('loginPassword');if(!x||x.dataset.rpcEye)return;x.dataset.rpcEye='1';let w=document.createElement('div');w.className='rpcPassWrap';x.parentNode.insertBefore(w,x);w.appendChild(x);let b=document.createElement('button');b.type='button';b.className='rpcEye';b.textContent='◉';b.onclick=()=>rpcTogglePassword('loginPassword',b);w.appendChild(b)}document.addEventListener('DOMContentLoaded',installPasswordEye);setTimeout(installPasswordEye,400);</script>"
              s=s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1);changed=True
          # Notification badge/sound. Realtime state already exists; this only makes pending items visible and audible.
          if 'RPC_NOTIFY_SOUND_V1' not in s:
              css="<style id='RPC_NOTIFY_SOUND_V1'>.rpcNotifyBadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;align-items:center;justify-content:center;border-radius:99px;background:#a94c43;color:#fff;font-size:10px;font-weight:900;float:right}.rpcNotifyPulse{animation:rpcnp 1s ease-in-out infinite}@keyframes rpcnp{50%{box-shadow:0 0 0 5px rgba(169,76,67,.16)}}</style>"
              js="<script id='RPC_NOTIFY_SOUND_V1'>let rpcNIds=new Set(),rpcNPrimed=false,rpcAC=null;function rpcNRelevant(n){let a=String(n?.audience||'GENERAL').toUpperCase();if(a==='GENERAL')return true;if(currentRole==='ADMIN')return a==='ADMIN';if(currentRole==='SUPERVISOR')return a==='SUPERVISOR';if(currentRole==='FUNCIONARIO')return a==='FUNCIONARIO'&&(!n.employeeId||n.employeeId===currentEmployeeId());if(currentRole==='CLIENTE')return a==='CLIENTE'&&(!n.clientId||n.clientId===currentClientId());return false}function rpcNBadge(){let c=(db.notifications||[]).filter(rpcNRelevant).filter(x=>!x.read).length;document.querySelectorAll('[data-page=\"notifications\"]').forEach(b=>{b.classList.toggle('rpcNotifyPulse',c>0);b.querySelector('.rpcNotifyBadge')?.remove();if(c){let s=document.createElement('span');s.className='rpcNotifyBadge';s.textContent=c>99?'99+':c;b.appendChild(s)}})}function rpcNBeep(){try{rpcAC=rpcAC||new(window.AudioContext||window.webkitAudioContext)();if(rpcAC.state==='suspended')rpcAC.resume();let o=rpcAC.createOscillator(),g=rpcAC.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,rpcAC.currentTime);g.gain.exponentialRampToValueAtTime(.12,rpcAC.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,rpcAC.currentTime+.28);o.connect(g);g.connect(rpcAC.destination);o.start();o.stop(rpcAC.currentTime+.3)}catch(e){}}function rpcNScan(){let rows=(db.notifications||[]).filter(rpcNRelevant),fresh=rpcNPrimed?rows.filter(x=>!rpcNIds.has(x.id)):[];rpcNIds=new Set(rows.map(x=>x.id));rpcNPrimed=true;rpcNBadge();if(fresh.length)rpcNBeep()}document.addEventListener('pointerdown',()=>{try{rpcAC=rpcAC||new(window.AudioContext||window.webkitAudioContext)();if(rpcAC.state==='suspended')rpcAC.resume()}catch(e){}},{passive:true});setInterval(rpcNScan,4000);</script>"
              s=s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1);changed=True
          # Replace the fake static route panel with a truthful live location summary for Admin/Supervisor.
          old_geo="function employeeMap(id){let l=db.locations.filter(x=>x.employeeId===id).slice(-1)[0];if(!l)return alert('No hay ubicación capturada todavía.');window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(l.lat+','+l.lng),'_blank')}"
          new_geo="function employeeMap(id){let ls=db.locations.filter(x=>x.employeeId===id).slice(-20),l=ls[ls.length-1];if(!l)return alert('No hay ubicación capturada todavía.');let q=l.lat+','+l.lng;window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank')}"
          if old_geo in s:s=s.replace(old_geo,new_geo,1);changed=True
          p.write_text(s,encoding='utf-8');print('CHANGED' if changed else 'NO_CHANGE')
          PY
      - name: Validate and remove temporary workflow
        run: |
          grep -q 'syncAuthEmployeeIntoDb' index.html
          grep -q 'attendanceWatchId' index.html
          grep -q 'RPC_PASSWORD_EYE_V1' index.html
          grep -q 'RPC_NOTIFY_SOUND_V1' index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git rm -f .github/workflows/finish-real-operations.yml .github/workflows/repair-real-operations.yml 2>/dev/null || true
          git add -u
          git commit -m "fix: finish real employee jornada gps notifications and mobile actions"
          git push
