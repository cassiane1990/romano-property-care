name: Fix admin mobile menu and profile photo
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          if 'rpcMobileBackdrop' not in s:
              s=re.sub(r'@media\(max-width:720px\)\{\.side\{width:270px;transform:translateX\(-100%\);transition:\.2s\}\.side\.open\{transform:translateX\(0\)\}', '@media(max-width:720px){.rpcMobileBackdrop{display:none;position:fixed;inset:0;background:rgba(36,24,15,.38);z-index:80}.rpcMobileBackdrop.show{display:block}.side{width:270px;transform:translateX(-100%);transition:.2s;z-index:90}.side.open{transform:translateX(0)}', s, count=1)
              if 'rpcMobileBackdrop' not in s:
                  s=s.replace('@media(max-width:720px){.side{display:none}', '@media(max-width:720px){.rpcMobileBackdrop{display:none;position:fixed;inset:0;background:rgba(36,24,15,.38);z-index:80}.rpcMobileBackdrop.show{display:block}.side{display:block;width:270px;transform:translateX(-100%);transition:.2s;z-index:90}.side.open{transform:translateX(0)}', 1)
              if 'rpcMobileBackdrop' not in s: raise SystemExit('MOBILE_CSS_NOT_FOUND')

              if '<div id="rpcMobileBackdrop"' not in s:
                  s=s.replace('<div class="app"><aside class="side">','<div class="app"><div id="rpcMobileBackdrop" class="rpcMobileBackdrop" onclick="toggleMobileMenu(false)"></div><aside class="side">',1)
              if '<div id="rpcMobileBackdrop"' not in s: raise SystemExit('APP_MARKUP_NOT_FOUND')

              s=s.replace("onclick=\"document.querySelector('.side').classList.toggle('open')\"", 'onclick="toggleMobileMenu()"', 1)

              if 'function toggleMobileMenu(' not in s:
                  s=s.replace('function buildNav(){', "function toggleMobileMenu(force){const side=document.querySelector('.side'),back=document.getElementById('rpcMobileBackdrop');if(!side)return;const isMobile=window.innerWidth<=720;const open=force===undefined?!side.classList.contains('open'):!!force;if(!isMobile){side.classList.remove('open');back?.classList.remove('show');return;}side.classList.toggle('open',open);back?.classList.toggle('show',open);}\nfunction buildNav(){",1)

              old_go="function go(page){if(!new Set(allowedPages()).has(page)){page=roleHome()}currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));q('title').textContent=NAV.find(n=>n[0]===page)?.[2]||(db.settings.customModules||[]).find(x=>x.id===page)?.name||page;render(page)}"
              new_go="function go(page){if(!new Set(allowedPages()).has(page)){page=roleHome()}currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));q('title').textContent=NAV.find(n=>n[0]===page)?.[2]||(db.settings.customModules||[]).find(x=>x.id===page)?.name||page;render(page);if(window.innerWidth<=720)toggleMobileMenu(false)}"
              if old_go in s: s=s.replace(old_go,new_go,1)

          if "localStorage.setItem('RPC_V78_PROFILE_PHOTO_'+email,photo)" not in s:
              s=s.replace("sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));save();closeModal();applyRoleUI();toast('Foto de perfil guardada.')", "sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));localStorage.setItem('RPC_V78_PROFILE_PHOTO_'+email,photo);save();closeModal();applyRoleUI();toast('Foto de perfil guardada.')", 1)
          if "localStorage.getItem('RPC_V78_PROFILE_PHOTO_'+email)" not in s:
              s=s.replace("return currentUser?.photo||db.settings.userProfiles[email]?.photo||db.settings.profilePhotos?.[currentRole]||''", "return currentUser?.photo||db.settings.userProfiles[email]?.photo||localStorage.getItem('RPC_V78_PROFILE_PHOTO_'+email)||db.settings.profilePhotos?.[currentRole]||''", 1)

          p.write_text(s,encoding='utf-8')
          print('PATCHED')
          PY
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore admin mobile menu and profile photo persistence"
          git push
