name: Fix ROMANO auth transport
on:
  push:
    paths:
      - '.github/workflows/fix-auth-transport.yml'
      - 'index.html'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login and state fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(); original=s
          login="""async function directAuthContext(user){const {data:p,error}=await rpcSupabase.from('user_profiles').select('role,display_name,active,company_id').eq('id',user.id).maybeSingle();if(error)throw error;if(!p||p.active===false)throw new Error('USUARIO_INACTIVO');let role=String(p.role||'ADMIN').toUpperCase().replace('FUNCIONÁRIO','FUNCIONARIO');return {role,display_name:p.display_name||user.email,company_id:p.company_id||null,active:p.active!==false};}\nasync function login(ev){ev.preventDefault();let loginValue=q('loginEmail').value.trim().toLowerCase(),pass=q('loginPassword').value;q('authError').style.display='none';try{if(rpcSupabase){let realEmail=TEST_EMAIL_MAP[loginValue]||loginValue;let {data,error}=await rpcSupabase.auth.signInWithPassword({email:realEmail,password:pass});if(!error&&data?.user){await completeMFAIfRequired();let cctx=await directAuthContext(data.user);currentRole=cctx.role;currentUser={id:data.user.id,email:data.user.email,displayName:cctx.display_name,name:cctx.display_name,role:currentRole,company_id:cctx.company_id,aal:data.session?.aal||'aal1'};sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));q('authScreen').style.display='none';applyRoleUI();go(roleHome());toast('Sesión segura iniciada · '+currentRole);await loadCloudState(false);await initCloudRealtime();return;}}}catch(err){console.warn('Cloud login:',err);try{await rpcSupabase?.auth.signOut()}catch{}}let a=TEST_ACCOUNTS[loginValue];if(!a||a.password!==pass){q('authError').textContent='No se pudo iniciar sesión con esa cuenta. Comprueba correo, contraseña o MFA.';q('authError').style.display='block';return}currentRole=a.role;currentUser={email:loginValue,name:a.name,role:a.role,devMode:true};sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));q('authScreen').style.display='none';applyRoleUI();go(roleHome());toast('Sesión de prueba · '+a.role)}\n"""
          s,n=re.subn(r"async function login\(ev\)\{.*?\nfunction roleHome\(\)",login+"function roleHome()",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('login block not found')
          restore="""async function restoreSession(){try{if(rpcSupabase){let {data:{session}}=await rpcSupabase.auth.getSession();if(session?.user){let ctx=await directAuthContext(session.user);if(ctx?.active){currentUser={id:session.user.id,email:session.user.email,displayName:ctx.display_name,name:ctx.display_name,role:ctx.role,company_id:ctx.company_id,aal:session.aal||'aal1'};currentRole=currentUser.role;q('authScreen').style.display='none';applyRoleUI();go(roleHome());await loadCloudState(false);await initCloudRealtime();return true;}}}let u=JSON.parse(sessionStorage.getItem('RPC_V78_SESSION')||'null');if(u&&TEST_ACCOUNTS[u.email]){currentUser=u;currentRole=u.role;q('authScreen').style.display='none';applyRoleUI();go(roleHome());return true}}catch(e){console.warn('restoreSession',e)}q('authScreen').style.display='grid';return false}\n\n"""
          s,n=re.subn(r"async function restoreSession\(\)\{.*?\n\nlet cloudSaveTimer",restore+"let cloudSaveTimer",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('restoreSession block not found')
          load="""async function loadCloudState(showToast=false){if(!rpcSupabase||!currentUser||currentUser.devMode||!navigator.onLine)return false;try{const r=await rpcCloud('state');if(r?.state&&Object.keys(r.state).length){cloudHydrating=true;db=r.state;db.cloudVersion=Number(r.version||db.cloudVersion||0);localStorage.setItem('RPC_V78',JSON.stringify(db));cloudHydrating=false;buildNav();render(currentPage||roleHome());if(showToast)toast('Datos centrales sincronizados');return true;}}catch(e){console.warn('Cloud state load via Edge Function',e)}try{const {data,error}=await rpcSupabase.from('rpc_app_state').select('state,version,updated_at').eq('company_id',currentUser.company_id).maybeSingle();if(error)throw error;if(data?.state&&Object.keys(data.state).length){cloudHydrating=true;db=data.state;db.cloudVersion=Number(data.version||0);localStorage.setItem('RPC_V78',JSON.stringify(db));cloudHydrating=false;buildNav();render(currentPage||roleHome());if(showToast)toast('Datos centrales sincronizados');return true;}}catch(e){console.warn('Cloud state direct fallback',e)}return false}\n"""
          s,n=re.subn(r"async function loadCloudState\(showToast=false\)\{.*?\n\}\n(?=async function initCloudRealtime)",load,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('loadCloudState block not found')
          if s!=original: p.write_text(s); print('PATCHED')
          else: print('NO_CHANGE')
          PY
      - name: Commit patch if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo 'No index change required'; exit 0; fi
          git config user.name 'ROMANO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove Edge Function dependency from login'
          git push
