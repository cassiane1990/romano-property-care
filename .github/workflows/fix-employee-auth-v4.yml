name: Remove all employee auth guards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove every auth guard block from employee page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index-funcionario.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<style id="romano-auth-guard-style">.*?</script>'
          matches=re.findall(pattern,s,flags=re.S)
          print('guard_blocks=',len(matches))
          if not matches:
              raise SystemExit('No employee auth guard blocks found')
          s2=re.sub(pattern,'',s,flags=re.S)
          p.write_text(s2,encoding='utf-8')
          print('remaining_style=',s2.count('romano-auth-guard-style'))
          print('remaining_check=',s2.count('romano-auth-checking'))
          PY
      - name: Verify employee page has no auth guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index-funcionario.html').read_text(encoding='utf-8')
          for x in ['romano-auth-guard-style','romano-auth-checking','ROMANO_AUTH_PROFILE_SYNC_V3']:
              print(x, s.count(x))
          if any(x in s for x in ['romano-auth-guard-style','romano-auth-checking','ROMANO_AUTH_PROFILE_SYNC_V3']):
              raise SystemExit('auth guard still present')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-employee-auth-v4.yml
          git add index-funcionario.html .github/workflows/fix-employee-auth-v4.yml
          git commit -m "fix: remove all employee auth redirect guards"
          git push origin HEAD:main
