name: Fix employee auth guard
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove employee auth redirects only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index-funcionario.html')
          s=p.read_text()
          s=re.sub(r'<!-- ROMANO_AUTH_PROFILE_SYNC_V3 -->.*?</script>', '', s, flags=re.S)
          s=re.sub(r'<!-- ROMANO_AUTH_PROFILE_SYNC_V1 -->.*?</script>', '', s, flags=re.S)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index-funcionario.html
          git diff --cached --quiet || git commit -m "fix: stop employee login redirect loop"
          git push
