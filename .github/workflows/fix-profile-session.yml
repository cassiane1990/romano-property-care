name: Fix profile session

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile session
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ROMANO_AUTH_PROFILE_SYNC_V1'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)
          patch = r'''<!-- ROMANO_AUTH_PROFILE_SYNC_V1 -->
          <style id="romano-auth-guard-style">html.romano-auth-checking body{visibility:hidden!important}</style>
          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script>
          (function(){
            const SUPABASE_URL='https://dhzptogrzuqreflcnsnb.supabase.co';
            const SUPABASE_KEY='sb_publishable_DFmwh4k4-6RWDJnjCRNppA_TFrBkIxN';
            const client=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
            document.documentElement.classList.add('romano-auth-checking');
            async function sync(){
              try{
                if(!client){ location.replace('acesso-funcionario.html'); return; }
                const {data:{session}}=await client.auth.getSession();
                if(!session){
                  localStorage.removeItem('romano_role');
                  localStorage.removeItem('romano_user');
                  localStorage.removeItem('romano_auth_user_id');
                  localStorage.removeItem('romano_display_name');
                  location.replace('acesso-funcionario.html');
                  return;
                }
                const {data:p,error}=await client.from('user_profiles').select('role,display_name,active,employee_id').eq('id',session.user.id).maybeSingle();
                if(error || !p || p.active===false){ await client.auth.signOut(); localStorage.removeItem('romano_role'); localStorage.removeItem('romano_user'); localStorage.removeItem('romano_auth_user_id'); localStorage.removeItem('romano_display_name'); location.replace('acesso-funcionario.html'); return; }
                const nextRole=p.role||'FUNCIONÁRIO';
                const nextUser=session.user.email||'';
                const changed=localStorage.getItem('romano_role')!==nextRole || localStorage.getItem('romano_user')!==nextUser || localStorage.getItem('romano_auth_user_id')!==session.user.id;
                localStorage.setItem('romano_role',nextRole);
                localStorage.setItem('romano_user',nextUser);
                localStorage.setItem('romano_auth_user_id',session.user.id);
                localStorage.setItem('romano_display_name',p.display_name||session.user.email||'');
                if(changed){ location.reload(); return; }
                document.documentElement.classList.remove('romano-auth-checking');
              }catch(e){
                console.error('ROMANO auth sync',e);
                document.documentElement.classList.remove('romano-auth-checking');
              }
            }
            window.romanoSupabase=client;
            window.romanoAuthSync=sync;
            window.addEventListener('DOMContentLoaded',sync,{once:true});
            window.logout=async function(){
              try{ if(client) await client.auth.signOut(); }catch(e){}
              localStorage.removeItem('romano_role');
              localStorage.removeItem('romano_user');
              localStorage.removeItem('romano_auth_user_id');
              localStorage.removeItem('romano_display_name');
              location.replace('acesso-funcionario.html');
            };
            window.setTestRole=function(r){
              if(window.role!=='ADMIN' && r!=='ADMIN') return;
              localStorage.setItem('romano_role',r);
              if(r!=='ADMIN') localStorage.removeItem('romano_user');
              location.reload();
            };
          })();
          </script>
          '''
          s = s.replace('</body>', patch + '\n</body>')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: prevent profile mixing [skip ci]"
          git push
