name: Fix profile session

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile session
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<!-- ROMANO_AUTH_PROFILE_SYNC_V1 -->')
          if start < 0:
              print('Old auth patch not found; nothing to replace')
              raise SystemExit(0)
          end = s.find('</body>', start)
          if end < 0:
              raise SystemExit('Could not find body end')
          patch = r'''<!-- ROMANO_AUTH_PROFILE_SYNC_V2 -->
          <style id="romano-auth-guard-style">html.romano-auth-checking body{visibility:hidden!important}</style>
          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script>
          (function(){
            const SUPABASE_URL='https://dhzptogrzuqreflcnsnb.supabase.co';
            const SUPABASE_KEY='sb_publishable_DFmwh4k4-6RWDJnjCRNppA_TFrBkIxN';
            const client=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
            document.documentElement.classList.add('romano-auth-checking');
            const clearIdentity=()=>['romano_role','romano_user','romano_auth_user_id','romano_display_name'].forEach(k=>localStorage.removeItem(k));
            async function sync(){
              try{
                if(!client){ location.replace('/acesso-funcionario.html'); return; }
                let session=null, profile=null;
                for(let attempt=0;attempt<8;attempt++){
                  const sr=await client.auth.getSession();
                  session=sr?.data?.session||null;
                  if(session){
                    const pr=await client.from('user_profiles').select('role,display_name,active,employee_id').eq('id',session.user.id).maybeSingle();
                    if(!pr.error && pr.data){ profile=pr.data; break; }
                  }
                  await new Promise(r=>setTimeout(r,500));
                }
                if(!session || !profile || profile.active===false){
                  await client.auth.signOut().catch(()=>{});
                  clearIdentity();
                  location.replace('/acesso-funcionario.html');
                  return;
                }
                const nextRole=profile.role||'FUNCIONÁRIO';
                const nextUser=session.user.email||'';
                localStorage.setItem('romano_role',nextRole);
                localStorage.setItem('romano_user',nextUser);
                localStorage.setItem('romano_auth_user_id',session.user.id);
                localStorage.setItem('romano_display_name',profile.display_name||nextUser);
                document.documentElement.classList.remove('romano-auth-checking');
              }catch(e){
                console.error('ROMANO auth sync',e);
                document.documentElement.classList.remove('romano-auth-checking');
              }
            }
            window.romanoSupabase=client;
            window.romanoAuthSync=sync;
            window.logout=async function(){
              try{ if(client) await client.auth.signOut(); }catch(e){}
              clearIdentity();
              location.replace('/acesso-funcionario.html');
            };
            window.setTestRole=function(r){
              if(window.role!=='ADMIN' && r!=='ADMIN') return;
              localStorage.setItem('romano_role',r);
              if(r!=='ADMIN') localStorage.removeItem('romano_user');
              location.reload();
            };
            sync();
          })();
          </script>
          '''
          s = s[:start] + patch + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: stabilize auth session [skip ci]"
          git push
