name: Fix real login flow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix employee real-login flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "await repairKnownRealUsers();q('authScreen').style.display='none';applyRoleUI();go(roleHome());toast('Sesión segura iniciada · '+currentRole);await loadCloudState(false);await initCloudRealtime();return;"
          new = "if(currentRole==='ADMIN') await repairKnownRealUsers();q('authScreen').style.display='none';applyRoleUI();go(roleHome());toast('Sesión segura iniciada · '+currentRole);await loadCloudState(false);await initCloudRealtime();return;"
          if old not in s:
              print('Target already fixed or not present')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Real login flow fixed')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "ROMANO Property Care Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix real employee login flow [skip ci]"
            git push
          fi
