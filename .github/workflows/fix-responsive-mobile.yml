name: Fix responsive mobile navigation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          # Mobile drawer: keep the full role menu available on phones.
          if 'rpcMobileBackdrop' not in s:
              old='@media(max-width:720px){.side{display:none}'
              new='@media(max-width:720px){.rpcMobileBackdrop{display:none;position:fixed;inset:0;background:rgba(36,24,15,.38);z-index:80}.rpcMobileBackdrop.show{display:block}.side{display:block;width:275px;transform:translateX(-100%);transition:transform .2s ease;z-index:90}.side.open{transform:translateX(0)}'
              if old not in s:
                  raise SystemExit('MOBILE_CSS_NOT_FOUND')
              s=s.replace(old,new,1)
              changed=True
          if '<div id="rpcMobileBackdrop"' not in s:
              marker='<div class="app"><aside class="side">'
              if marker not in s:
                  raise SystemExit('APP_MARKUP_NOT_FOUND')
              s=s.replace(marker,'<div class="app"><div id="rpcMobileBackdrop" class="rpcMobileBackdrop" onclick="toggleMobileMenu(false)"></div><aside class="side">',1)
              changed=True
          if 'onclick="toggleMobileMenu()"' not in s:
              old='onclick="document.querySelector(\'.side\').classList.toggle(\'open\')"'
              if old not in s:
                  raise SystemExit('MENU_BUTTON_NOT_FOUND')
              s=s.replace(old,'onclick="toggleMobileMenu()"',1)
              changed=True
          if 'function toggleMobileMenu(' not in s:
              marker='function buildNav(){'
              if marker not in s:
                  raise SystemExit('BUILD_NAV_NOT_FOUND')
              fn="function toggleMobileMenu(force){const side=document.querySelector('.side'),back=document.getElementById('rpcMobileBackdrop');if(!side)return;const isMobile=window.innerWidth<=720;if(!isMobile){side.classList.remove('open');back?.classList.remove('show');return;}const open=force===undefined?!side.classList.contains('open'):!!force;side.classList.toggle('open',open);back?.classList.toggle('show',open);}\n"
              s=s.replace(marker,fn+marker,1)
              changed=True
          # Any menu selection closes the drawer on phones, including client, supervisor and employee menus.
          old_go="function go(page){if(!new Set(allowedPages()).has(page)){page=roleHome()}currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));q('title').textContent=NAV.find(n=>n[0]===page)?.[2]||(db.settings.customModules||[]).find(x=>x.id===page)?.name||page;render(page)}"
          new_go="function go(page){if(!new Set(allowedPages()).has(page)){page=roleHome()}currentPage=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page));q('title').textContent=NAV.find(n=>n[0]===page)?.[2]||(db.settings.customModules||[]).find(x=>x.id===page)?.name||page;render(page);if(window.innerWidth<=720)toggleMobileMenu(false)}"
          if old_go in s and new_go not in s:
              s=s.replace(old_go,new_go,1)
              changed=True
          p.write_text(s,encoding='utf-8')
          print('PATCHED' if changed else 'ALREADY_PATCHED')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html .github/workflows/fix-responsive-mobile.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make employee supervisor and client mobile navigation responsive"
          git push
