name: Locate employee app state
on:
  push:
    paths:
      - '.github/workflows/fix-role-fallback.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate state code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index-funcionario.html').read_text(encoding='utf-8')
          for needle in ['function init','function save','const db','let db','var db','db={','role','ADMIN']:
              print('\n###',needle)
              start=0; n=0
              while True:
                  pos=s.find(needle,start)
                  if pos<0: break
                  print(repr(s[max(0,pos-250):pos+500]))
                  start=pos+len(needle); n+=1
                  if n>=6: break
          PY
