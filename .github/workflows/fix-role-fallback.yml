name: Restore employee role state
on:
  push:
    paths:
      - '.github/workflows/fix-role-fallback.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore role state only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-funcionario.html')
          s=p.read_text(encoding='utf-8')
          marker="function logout(){"
          if "let role=localStorage.getItem('romano_role')||'FUNCIONÁRIO';" in s:
              raise SystemExit('role state already present')
          if marker not in s:
              raise SystemExit('logout marker not found')
          s=s.replace(marker,"let role=localStorage.getItem('romano_role')||'FUNCIONÁRIO';\nfunction logout(){",1)
          p.write_text(s,encoding='utf-8')
          print('restored role state')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-funcionario.html
          git commit -m 'fix: restore employee role state'
          git push
          git rm .github/workflows/fix-role-fallback.yml
          git commit -m 'chore: remove temporary role workflow'
          git push
