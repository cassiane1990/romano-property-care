name: Fix employee role fallback
on:
  push:
    paths:
      - '.github/workflows/fix-role-fallback.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix role fallback only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index-funcionario.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"let role\s*=\s*localStorage\.getItem\(['\"]romano_role['\"]\)\s*\|\|\s*['\"]ADMIN['\"]\s*;"
          s2,n=re.subn(pattern,"let role=localStorage.getItem('romano_role')||'FUNCIONÁRIO';",s,count=1)
          if n!=1:
              m=re.search(r"let role.{0,160}",s)
              raise SystemExit('Role initializer not found; nearby='+repr(m.group(0) if m else 'NONE'))
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-funcionario.html
          git commit -m 'fix: employee role fallback'
          git push
          git rm .github/workflows/fix-role-fallback.yml
          git commit -m 'chore: remove temporary role fix workflow'
          git push
