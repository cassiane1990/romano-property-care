name: Inspect employee role initializer
on:
  push:
    paths:
      - '.github/workflows/fix-role-fallback.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect role code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index-funcionario.html').read_text(encoding='utf-8')
          for needle in ['romano_role','role=','let role','const role','var role']:
              print('\n###',needle)
              pos=0
              found=0
              while True:
                  pos=s.find(needle,pos)
                  if pos<0: break
                  print(repr(s[max(0,pos-180):pos+300]))
                  found+=1; pos+=len(needle)
                  if found>=10: break
          print('\nlength',len(s))
          PY
