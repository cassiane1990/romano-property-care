name: Fix employee role fallback
on:
  push:
    paths:
      - '.github/workflows/fix-role-fallback.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix role fallback only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-funcionario.html')
          s=p.read_text(encoding='utf-8')
          old="let role=localStorage.getItem('romano_role')||'ADMIN';"
          new="let role=localStorage.getItem('romano_role')||'FUNCIONÁRIO';"
          if old not in s:
              raise SystemExit('Expected role fallback not found')
          s2=s.replace(old,new,1)
          p.write_text(s2,encoding='utf-8')
          print('role fallback changed:', s != s2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-funcionario.html
          git commit -m 'fix: employee role fallback'
          git push
          git rm .github/workflows/fix-role-fallback.yml
          git commit -m 'chore: remove temporary role fix workflow'
          git push
