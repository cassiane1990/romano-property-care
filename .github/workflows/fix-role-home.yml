name: Fix role home
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix roleHome only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          b=p.read_bytes()
          old=b"function roleHome(){return currentRole==='CLIENTE'?'dashboard':'devocional'}"
          new=b"function roleHome(){if(currentRole==='CLIENTE')return 'dashboard';if(currentRole==='SUPERVISOR')return 'operacion';if(currentRole==='FUNCIONARIO')return 'devocional';return 'dashboard'}"
          if b.count(old)!=1:
              raise SystemExit(f'expected one roleHome match, found {b.count(old)}')
          p.write_bytes(b.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore role-specific home routing' || exit 0
          git push
