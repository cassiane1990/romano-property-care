name: Fix RPC transport v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rpcCloud transport
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="async function rpcCloud(path,options={}){if(!rpcSupabase)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');const {data:{session}}=await rpcSupabase.auth.getSession();if(!session?.access_token)return null;let body=options.body;if(typeof body==='string'){try{body=JSON.parse(body)}catch{}}const {data,error}=await rpcSupabase.functions.invoke('romano-api/'+path,{method:options.method||'GET',body,headers:{apikey:RPC_CLOUD.key,...(options.headers||{})}});if(error)throw error;return data;}"
          new="async function rpcCloud(path,options={}){if(!rpcSupabase)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');const {data:{session}}=await rpcSupabase.auth.getSession();if(!session?.access_token)return null;let body=options.body;if(typeof body==='string'){try{body=JSON.parse(body)}catch{}}const headers={'x-rpc-path':path,...(options.headers||{})};const {data,error}=await rpcSupabase.functions.invoke('romano-api',{method:options.method||'GET',body,headers});if(error)throw error;return data;}"
          if old not in s:
              raise SystemExit('target rpcCloud v1 patch not found; no changes made')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: invoke romano-api base function with route header"
          git push
