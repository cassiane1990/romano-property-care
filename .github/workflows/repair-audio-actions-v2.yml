name: Repair audio action
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audio fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'RPC_AUDIO_FALLBACK_V1' not in s:
              old=base64.b64decode('').decode()
              new=base64.b64decode('').decode()
              if old not in s: raise SystemExit('audio marker not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate commit and remove workflow
        run: |
          grep -q 'RPC_AUDIO_FALLBACK_V1' index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git rm -f .github/workflows/repair-audio-actions-v2.yml .github/workflows/repair-audio-actions.yml 2>/dev/null || true
          git add -u
          git commit -m "fix: microphone fallback on mobile" || true
          git push
