name: Repair audio and pending actions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audio fallback and pending badges
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); changed=False
          if 'RPC_AUDIO_FALLBACK_V1' not in s:
              old="function startIncidentAudio(){if(!navigator.mediaDevices?.getUserMedia)return alert('Este navegador no permite grabar audio.');navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{incidentChunks=[];incidentRecorder=new MediaRecorder(stream);incidentRecorder.ondataavailable=e=>{if(e.data.size)incidentChunks.push(e.data)};incidentRecorder.onstop=()=>{let blob=new Blob(incidentChunks,{type:'audio/webm'}),r=new FileReader();r.onload=()=>{window._incidentAudio=r.result;toast('Audio registrado. Ahora guarde la incidencia.');};r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};incidentRecorder.start();toast('Grabando incidencia…');}).catch(e=>alert('No se pudo acceder al micrófono: '+e.message))}"
              new="function rpcAudioFallback(){let i=document.createElement('input');i.type='file';i.accept='audio/*';i.setAttribute('capture','microphone');i.onchange=()=>{let f=i.files&&i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window._incidentAudio=r.result;toast('Audio registrado. Ahora guarde la incidencia.')};r.readAsDataURL(f)};i.click()}function startIncidentAudio(){if(navigator.mediaDevices?.getUserMedia&&window.MediaRecorder){navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{incidentChunks=[];incidentRecorder=new MediaRecorder(stream);incidentRecorder.ondataavailable=e=>{if(e.data.size)incidentChunks.push(e.data)};incidentRecorder.onstop=()=>{let blob=new Blob(incidentChunks,{type:incidentRecorder.mimeType||'audio/webm'}),r=new FileReader();r.onload=()=>{window._incidentAudio=r.result;toast('Audio registrado. Ahora guarde la incidencia.')};r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};incidentRecorder.start();toast('Grabando incidencia…')}).catch(()=>rpcAudioFallback())}else rpcAudioFallback()}window.RPC_AUDIO_FALLBACK_V1=true"
              if old not in s: raise SystemExit('audio function not found')
              s=s.replace(old,new,1);changed=True
          if 'RPC_PENDING_ACTIONS_V1' not in s:
              css="<style id='RPC_PENDING_ACTIONS_V1'>.rpcPendingPulse{animation:rpcPendingPulse 1s ease-in-out infinite}.rpcPendingBadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;align-items:center;justify-content:center;border-radius:99px;background:#a94c43;color:#fff;font-size:10px;font-weight:900;float:right}@keyframes rpcPendingPulse{50%{box-shadow:0 0 0 5px rgba(169,76,67,.16)}}</style>"
              js="<script id='RPC_PENDING_ACTIONS_V1'>function rpcPendingActions(){let req=db.materialRequests||[],cr=db.clientRequests||[];let mr=currentRole==='FUNCIONARIO'?req.filter(x=>x.employeeId===currentEmployeeId()&&['RECHAZADO','ENTREGADO'].includes(x.status)).length:currentRole==='SUPERVISOR'?req.filter(x=>x.status==='PENDIENTE_SUPERVISOR').length:currentRole==='ADMIN'?req.filter(x=>['ENVIADO_ADMIN','PENDIENTE_ADMIN'].includes(x.status)).length:0;let cc=cr.filter(x=>['PENDIENTE','Pendiente de aprobación','Pendiente de atención'].includes(x.status)).filter(x=>currentRole==='CLIENTE'?x.clientId===currentClientId():true).length;document.querySelectorAll('[data-page="materialRequests"]').forEach(b=>{b.classList.toggle('rpcPendingPulse',mr>0);b.querySelector('.rpcPendingBadge')?.remove();if(mr){let z=document.createElement('span');z.className='rpcPendingBadge';z.textContent=mr;b.appendChild(z)}});document.querySelectorAll('[data-page="clientRequests"]').forEach(b=>{b.classList.toggle('rpcPendingPulse',cc>0);b.querySelector('.rpcPendingBadge')?.remove();if(cc){let z=document.createElement('span');z.className='rpcPendingBadge';z.textContent=cc;b.appendChild(z)}})}document.addEventListener('click',()=>{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{})},{once:true});setInterval(rpcPendingActions,4000);</script>"
              s=s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1);changed=True
          p.write_text(s,encoding='utf-8');print('PATCHED' if changed else 'NO_CHANGE')
          PY
      - name: Validate and remove workflow
        run: |
          grep -q 'RPC_AUDIO_FALLBACK_V1' index.html
          grep -q 'RPC_PENDING_ACTIONS_V1' index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git rm -f .github/workflows/repair-audio-actions.yml
          git add -u
          git commit -m "fix: audio fallback and visible pending actions"
          git push
