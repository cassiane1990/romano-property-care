name: Repair login persistence
on:
  push:
    branches:
      - main
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker="async function saveCloudState()"
          start=s.index(marker); end=s.index("\nfunction save()",start)
          block=s[start:end]
          if "Direct admin state save" not in block:
              block=block.replace("    }catch(e){", "    }catch(e){\n      if(currentRole==='ADMIN'&&currentUser.company_id){try{const {data:cur,error:re}=await rpcSupabase.from('rpc_app_state').select('version').eq('company_id',currentUser.company_id).maybeSingle();if(re)throw re;const next=Number(cur?.version||0)+1;const {error:we}=await rpcSupabase.from('rpc_app_state').upsert({company_id:currentUser.company_id,state:db,version:next,updated_by:currentUser.id,updated_at:new Date().toISOString()},{onConflict:'company_id'});if(!we){db.cloudVersion=next;localStorage.setItem('RPC_V78',JSON.stringify(db));return}}catch(de){console.warn('Direct admin state save',de)}}",1)
              s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          print('PATCHED')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: make role login and cloud persistence reliable'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/repair-login-persistence.yml
          git commit -m 'chore: remove temporary repair workflow'
          git push