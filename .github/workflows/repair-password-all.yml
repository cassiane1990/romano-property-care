name: Password visibility all fields
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add password eyes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'RPC_PASSWORD_ALL_V1' not in s:
              js=base64.b64decode('').decode()
              s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          grep -q 'RPC_PASSWORD_ALL_V1' index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git rm -f .github/workflows/repair-password-all.yml
          git add -u
          git commit -m "fix: show password visibility on all password fields"
          git push
