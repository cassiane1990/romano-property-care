name: Repair real operations
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="""async function rpcCloud(path,options={}){if(!rpcSupabase)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');const {data:{session}}=await rpcSupabase.auth.getSession();if(!session?.access_token)return null;const r=await fetch(RPC_CLOUD.api+'/'+path,{...options,headers:{'Authorization':'Bearer '+session.access_token,'apikey':RPC_CLOUD.key,'Content-Type':'application/json',...(options.headers||{})}});let body=null;try{body=await r.json()}catch{}if(!r.ok)throw new Error(body?.error||'API error '+r.status);return body;}"""
          new="""async function rpcCloud(path,options={}){if(!rpcSupabase)throw new Error('SUPABASE_CLIENT_UNAVAILABLE');const {data:{session}}=await rpcSupabase.auth.getSession();if(!session?.access_token)return null;const {data,error}=await rpcSupabase.functions.invoke('romano-api',{method:options.method||'GET',body:options.body,headers:{'x-rpc-path':String(path||''),...(options.headers||{})}});if(error)throw error;return data;}"""
          if old not in s: raise SystemExit('RPC_PATTERN_NOT_FOUND')
          s=s.replace(old,new,1)
          login_re=re.compile(r"async function login\(ev\)\{.*?\nfunction roleHome\(\)",re.S)
          login="""async function directAuthContext(user){if(!rpcSupabase||!user?.id)throw new Error('AUTH_USER_MISSING');const {data,error}=await rpcSupabase.from('user_profiles').select('role,display_name,active,company_id,employee_id,client_id').eq('id',user.id).maybeSingle();if(error)throw error;if(!data?.active)throw new Error('USUARIO_INACTIVO');return data;}
async function syncAuthEmployeeIntoDb(){if(!currentUser||!['FUNCIONARIO','SUPERVISOR'].includes(currentRole))return false;db.employees=db.employees||[];let email=String(currentUser.email||'').toLowerCase(),x=db.employees.find(v=>String(v.email||'').toLowerCase()===email);if(!x){x={id:'AUTH-'+String(currentUser.id||email).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,48)};db.employees.push(x)}let before=JSON.stringify(x);Object.assign(x,{name:currentUser.displayName||currentUser.name||email,role:currentRole,email,active:true});currentUser.employeeId=x.id;sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));return before!==JSON.stringify(x)}
async function login(ev){ev.preventDefault();let loginValue=q('loginEmail').value.trim().toLowerCase(),pass=q('loginPassword').value;q('authError').style.display='none';try{if(rpcSupabase){let realEmail=TEST_EMAIL_MAP[loginValue]||loginValue;let {data,error}=await rpcSupabase.auth.signInWithPassword({email:realEmail,password:pass});if(!error&&data?.user){await completeMFAIfRequired();let cctx=await directAuthContext(data.user);currentRole=String(cctx.role||'ADMIN').replace('FUNCIONÁRIO','FUNCIONARIO');currentUser={id:data.user.id,email:data.user.email,displayName:cctx.display_name||data.user.email,name:cctx.display_name||data.user.email,role:currentRole,company_id:cctx.company_id,employeeId:cctx.employee_id,clientId:cctx.client_id};q('authScreen').style.display='none';applyRoleUI();go(roleHome());await loadCloudState(false);let changed=await syncAuthEmployeeIntoDb();if(changed)save();await initCloudRealtime();enableBrowserNotifications();return;}}}catch(err){console.warn('Cloud login:',err);q('authError').textContent='No se pudo iniciar sesión con esa cuenta. Comprueba correo, contraseña o MFA.';q('authError').style.display='block';try{await rpcSupabase?.auth.signOut()}catch{}return}let a=TEST_ACCOUNTS[loginValue];if(!a||a.password!==pass){q('authError').textContent='No se pudo iniciar sesión con esa cuenta. Comprueba correo, contraseña o MFA.';q('authError').style.display='block';return}currentRole=a.role;currentUser={email:loginValue,name:a.name,displayName:a.name,role:a.role,devMode:true};sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));q('authScreen').style.display='none';applyRoleUI();go(roleHome());toast('Sesión de prueba · '+a.role)}
function roleHome()"""
          s,n=login_re.subn(login,s,count=1)
          if n!=1: raise SystemExit('LOGIN_PATTERN_NOT_FOUND')
          restore_re=re.compile(r"async function restoreSession\(\)\{.*?\n\nlet cloudSaveTimer",re.S)
          restore="""async function restoreSession(){try{if(rpcSupabase){let {data:{session}}=await rpcSupabase.auth.getSession();if(session?.user){let cctx=await directAuthContext(session.user);currentRole=String(cctx.role||'ADMIN').replace('FUNCIONÁRIO','FUNCIONARIO');currentUser={id:session.user.id,email:session.user.email,displayName:cctx.display_name||session.user.email,name:cctx.display_name||session.user.email,role:currentRole,company_id:cctx.company_id,employeeId:cctx.employee_id,clientId:cctx.client_id};q('authScreen').style.display='none';applyRoleUI();go(roleHome());await loadCloudState(false);let changed=await syncAuthEmployeeIntoDb();if(changed)save();await initCloudRealtime();updateNotificationBadge();return true;}}}let u=JSON.parse(sessionStorage.getItem('RPC_V78_SESSION')||'null');if(u&&TEST_ACCOUNTS[u.email]){currentUser=u;currentRole=u.role;q('authScreen').style.display='none';applyRoleUI();go(roleHome());return true}}catch(e){console.warn('restoreSession',e)}q('authScreen').style.display='grid';return false}

let cloudSaveTimer"""
          s,n=restore_re.subn(restore,s,count=1)
          if n!=1: raise SystemExit('RESTORE_PATTERN_NOT_FOUND')
          old_emp="function saveEmployee(id){if(!rpcIsAdmin())return rpcDenyRole(\"Área exclusiva de Administración.\");let x=id?e(id):{id:'E'+Date.now()};Object.assign(x,{name:q('en').value,role:q('er').value,phone:q('ep').value,email:q('ee').value,entry:q('ed').value,active:q('ea').value==='1',notes:q('eo').value,permissions:{services:q('ep_services')?.checked,chat:q('ep_chat')?.checked,quality:q('ep_quality')?.checked,photos:q('ep_photos')?.checked,finance:q('ep_finance')?.checked}});if(!id)db.employees.push(x);audit(id?'Editar funcionario':'Crear funcionario',x.name);save();closeModal();render('employees')}"
          new_emp="function saveEmployee(id){if(!rpcIsAdmin())return rpcDenyRole('Área exclusiva de Administración.');db.employees=db.employees||[];let email=(q('ee')?.value||'').trim().toLowerCase(),x=id?e(id):db.employees.find(v=>String(v.email||'').toLowerCase()===email)||{id:'E'+Date.now()};let isNew=!db.employees.includes(x);Object.assign(x,{name:q('en').value.trim(),role:q('er').value,phone:q('ep').value,email,entry:q('ed').value,active:q('ea').value==='1',notes:q('eo').value,permissions:{services:!!q('ep_services')?.checked,chat:!!q('ep_chat')?.checked,quality:!!q('ep_quality')?.checked,photos:!!q('ep_photos')?.checked,finance:!!q('ep_finance')?.checked}});if(isNew)db.employees.push(x);audit(isNew?'Crear funcionario':'Editar funcionario',x.name);save();closeModal();render('employees');toast(isNew?'Funcionario guardado correctamente.':'Funcionario actualizado correctamente.')}"
          if old_emp not in s: raise SystemExit('EMPLOYEE_SAVE_PATTERN_NOT_FOUND')
          s=s.replace(old_emp,new_emp,1)
          # Persist profile photos locally as well.
          s=s.replace("return currentUser?.photo||db.settings.userProfiles[email]?.photo||db.settings.profilePhotos?.[currentRole]||''","return currentUser?.photo||db.settings.userProfiles[email]?.photo||localStorage.getItem('RPC_V78_PROFILE_PHOTO_'+email)||db.settings.profilePhotos?.[currentRole]||''",1)
          s=s.replace("currentUser.photo=photo;sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));save();closeModal();applyRoleUI();toast('Foto de perfil guardada.')","currentUser.photo=photo;localStorage.setItem('RPC_V78_PROFILE_PHOTO_'+email,photo);sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify(currentUser));save();closeModal();applyRoleUI();toast('Foto de perfil guardada.')",1)
          # Real jornada GPS tracking.
          old_in="function clockInSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.find(x=>x.employeeId===id&&!x.out);if(open)return toast('Ya tiene una entrada abierta.');let now=new Date();let rec={employeeId:id,date:todayISO(),inISO:now.toISOString(),in:now.toLocaleString('es-ES'),status:'Trabajando',location:false};let finish=()=>{db.attendance.push(rec);save();render('employee');toast('Entrada registrada correctamente.')};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{rec.location={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};finish()},()=>finish(),{enableHighAccuracy:true,timeout:10000,maximumAge:0});else finish()}"
          new_in="let attendanceWatchId=null,attendanceLastSent=0;function startAttendanceWatch(id){if(attendanceWatchId!==null||!navigator.geolocation)return;attendanceWatchId=navigator.geolocation.watchPosition(pos=>{if(Date.now()-attendanceLastSent<20000)return;attendanceLastSent=Date.now();let rec=(db.attendance||[]).slice().reverse().find(x=>x.employeeId===id&&!x.out);if(!rec)return;let loc={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),accuracy:Math.round(pos.coords.accuracy),at:new Date().toISOString()};rec.location=loc;rec.lastLocation=loc;db.locations=db.locations||[];db.locations.push({employeeId:id,...loc,source:'JORNADA'});if(db.locations.length>5000)db.locations=db.locations.slice(-5000);save()},()=>{}, {enableHighAccuracy:true,maximumAge:10000,timeout:15000})}function stopAttendanceWatch(){if(attendanceWatchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(attendanceWatchId);attendanceWatchId=null}}function clockInSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.find(x=>x.employeeId===id&&!x.out);if(open)return toast('Ya tiene una entrada abierta.');let now=new Date(),rec={employeeId:id,date:todayISO(),inISO:now.toISOString(),in:now.toLocaleString('es-ES'),status:'Trabajando',location:false};let finish=()=>{db.attendance.push(rec);save();render('employee');startAttendanceWatch(id);toast('Entrada registrada correctamente.')};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{rec.location={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),accuracy:Math.round(pos.coords.accuracy),at:new Date().toISOString()};db.locations=db.locations||[];db.locations.push({employeeId:id,...rec.location,source:'JORNADA'});finish()},()=>finish(),{enableHighAccuracy:true,timeout:10000,maximumAge:0});else finish()}"
          if old_in not in s: raise SystemExit('CLOCK_IN_PATTERN_NOT_FOUND')
          s=s.replace(old_in,new_in,1)
          old_out="function clockOutSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.slice().reverse().find(x=>x.employeeId===id&&!x.out);if(!open)return toast('No hay una entrada abierta.');let now=new Date();open.outISO=now.toISOString();open.out=now.toLocaleString('es-ES');open.date=open.date||todayISO();open.status='Finalizado';save();render('employee');toast('Salida registrada correctamente.')}"
          new_out="function clockOutSelf(){let id=currentEmployeeId();if(!id)return toast('Funcionario no identificado.');db.attendance=db.attendance||[];let open=db.attendance.slice().reverse().find(x=>x.employeeId===id&&!x.out);if(!open)return toast('No hay una entrada abierta.');let now=new Date();open.outISO=now.toISOString();open.out=now.toLocaleString('es-ES');open.date=open.date||todayISO();open.status='Finalizado';stopAttendanceWatch();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{open.location={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),accuracy:Math.round(pos.coords.accuracy),at:new Date().toISOString()};db.locations=db.locations||[];db.locations.push({employeeId:id,...open.location,source:'JORNADA_FIN'});save();render('employee');toast('Salida registrada correctamente.')},()=>{save();render('employee');toast('Salida registrada correctamente.')},{enableHighAccuracy:true,timeout:10000,maximumAge:0});else{save();render('employee');toast('Salida registrada correctamente.')}}"
          if old_out not in s: raise SystemExit('CLOCK_OUT_PATTERN_NOT_FOUND')
          s=s.replace(old_out,new_out,1)
          # Incoming notification signal and visible/pulsing badge.
          if 'RPC_REAL_NOTIFY_V1' not in s:
              runtime='''<style id="RPC_REAL_NOTIFY_V1">.rpcNotifyBadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;align-items:center;justify-content:center;border-radius:99px;background:#a94c43;color:#fff;font-size:10px;font-weight:900;float:right}.rpcNotifyPulse{animation:rpcNotifyPulse 1s ease-in-out infinite}@keyframes rpcNotifyPulse{50%{box-shadow:0 0 0 5px rgba(169,76,67,.16)}}</style><script id="RPC_REAL_NOTIFY_V1">let rpcAudioCtx=null,rpcSeenNotificationIds=new Set(),rpcNotifyPrimed=false;function rpcRelevantNotification(n){let a=String(n?.audience||'GENERAL').toUpperCase();if(a==='GENERAL')return true;if(currentRole==='ADMIN')return a==='ADMIN';if(currentRole==='SUPERVISOR')return a==='SUPERVISOR';if(currentRole==='FUNCIONARIO')return a==='FUNCIONARIO'&&(!n.employeeId||n.employeeId===currentEmployeeId());if(currentRole==='CLIENTE')return a==='CLIENTE'&&(!n.clientId||n.clientId===currentClientId());return false}function rpcBeep(){try{rpcAudioCtx=rpcAudioCtx||new(window.AudioContext||window.webkitAudioContext)();if(rpcAudioCtx.state==='suspended')rpcAudioCtx.resume();let o=rpcAudioCtx.createOscillator(),g=rpcAudioCtx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,rpcAudioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.12,rpcAudioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,rpcAudioCtx.currentTime+.28);o.connect(g);g.connect(rpcAudioCtx.destination);o.start();o.stop(rpcAudioCtx.currentTime+.3)}catch(e){}}function enableBrowserNotifications(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});try{rpcAudioCtx=rpcAudioCtx||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}function updateNotificationBadge(){let count=(db.notifications||[]).filter(rpcRelevantNotification).filter(x=>!x.read).length;document.querySelectorAll('[data-page="notifications"]').forEach(b=>{b.classList.toggle('rpcNotifyPulse',count>0);b.querySelector('.rpcNotifyBadge')?.remove();if(count){let s=document.createElement('span');s.className='rpcNotifyBadge';s.textContent=count>99?'99+':String(count);b.appendChild(s)}})}function rpcSignalNotifications(){let rows=(db.notifications||[]).filter(rpcRelevantNotification),fresh=rpcNotifyPrimed?rows.filter(x=>!rpcSeenNotificationIds.has(x.id)):[];rpcSeenNotificationIds=new Set(rows.map(x=>x.id));rpcNotifyPrimed=true;updateNotificationBadge();if(fresh.length){rpcBeep();if('Notification'in window&&Notification.permission==='granted')try{new Notification(fresh[0].title||'ROMANO',{body:fresh[0].body||'Nueva notificación'})}catch(e){}}}document.addEventListener('pointerdown',()=>{try{rpcAudioCtx=rpcAudioCtx||new(window.AudioContext||window.webkitAudioContext)();if(rpcAudioCtx.state==='suspended')rpcAudioCtx.resume()}catch(e){}},{passive:true});setInterval(()=>{updateNotificationBadge()},4000);</script>'''
              s=s.replace('</body>',runtime+'</body>',1)
          # Mobile drawer for every role: the complete side menu remains available on phones.
          if 'RPC_MOBILE_ALL_ROLES_V3' not in s:
              css='''<style id="RPC_MOBILE_ALL_ROLES_V3">@media(max-width:720px){.side{display:block!important;width:275px!important;position:fixed!important;left:0!important;top:0!important;bottom:0!important;transform:translateX(-100%)!important;transition:transform .2s ease!important;z-index:210!important;overflow:auto!important}.side.open{transform:translateX(0)!important}.main{margin:0!important;width:100%!important}.bottom{z-index:205!important}.menuToggle{display:grid!important;touch-action:manipulation}.modal{max-width:calc(100vw - 24px)!important;max-height:92vh!important}.tablewrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}}</style>'''
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          print('PATCHED_REAL_OPERATIONS')
          PY
      - name: Commit and remove workflow
        run: |
          grep -q "functions.invoke('romano-api'" index.html
          grep -q "directAuthContext" index.html
          grep -q "syncAuthEmployeeIntoDb" index.html
          grep -q "attendanceWatchId" index.html
          grep -q "RPC_REAL_NOTIFY_V1" index.html
          grep -q "RPC_MOBILE_ALL_ROLES_V3" index.html
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git rm -f .github/workflows/repair-real-operations.yml
          git add -u
          git commit -m "fix: restore real saves jornada gps media notifications and mobile roles"
          git push
