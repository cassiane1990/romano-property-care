name: restore-employee
on:
  push:
    paths:
      - '.github/workflows/restore-employee.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore employee source
        run: |
          cp index.html index-funcionario.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index-funcionario.html')
          s=p.read_text()
          s=s.replace("let role=localStorage.getItem('romano_role')||'ADMIN';", "let role=localStorage.getItem('romano_role')||'FUNCIONÁRIO';", 1)
          s=s.replace('id="userName">Administrador', 'id="userName">Funcionário', 1)
          s=s.replace('id="roleBadge">ADMIN', 'id="roleBadge">FUNCIONÁRIO', 1)
          s=s.replace("function currentEmployeeName(){const u=localStorage.getItem('romano_user');const e=db.employees.find(x=>x.username===u);return e?.name||''}", "function currentEmployeeName(){const u=localStorage.getItem('romano_user');const e=db.employees.find(x=>x.username===u);return e?.name||localStorage.getItem('romano_display_name')||''}", 1)
          p.write_text(s)
          a=Path('acesso-funcionario.html')
          x=a.read_text()
          x=x.replace("window.location.replace('/index-funcionario.html?employee=1&v=20260908')", "window.location.replace(p.role==='ADMIN'?'/index.html':'/index-funcionario.html?employee=1&v=20260908')", 1)
          a.write_text(x)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-funcionario.html acesso-funcionario.html
          git commit -m 'fix: restore employee app source' || true
          git push
