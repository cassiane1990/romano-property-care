name: Romano mini repair
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python3 .github/romano_minirepair.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/app.js
      - name: Commit app
        run: |
          git config user.name 'ROMANO Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: restore real authentication transport'
          git push
      - name: Remove temporary files
        run: |
          git rm -f .github/romano_minirepair.py .github/workflows/romano_minirepair.yml || true
          git commit -m 'chore: remove temporary repair files' || true
          git push || true
