<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROMANO PROPERTY CARE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#171513;--gold:#b18a45;--champ:#efe6d4;--paper:#fbf8f1;--line:#e5dac8;--muted:#7b746b;--danger:#a43d35;--ok:#597653}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#f1e5cd 0,transparent 38%),var(--paper)}.card{background:#fffdfa;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #4b392014}.login-card{width:min(430px,100%);padding:34px}.brand{text-align:center;margin-bottom:28px}.brand-mark{width:76px;height:76px;border-radius:50%;margin:auto;background:#151310;color:#d6b36c;display:grid;place-items:center;font:700 36px Georgia,serif;border:2px solid #d6b36c}.brand h1{font:700 25px Georgia,serif;letter-spacing:2px;margin:16px 0 4px}.brand p{margin:0;color:var(--muted);font-size:12px;letter-spacing:2px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.btn{border:0;border-radius:12px;padding:13px 16px;cursor:pointer}.btn-primary{width:100%;background:var(--ink);color:#f4dfb4}.error{color:var(--danger);font-size:13px;margin-top:12px}.shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.side{background:#151310;color:#f7f0e2;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}.side .brand-mini{font:700 19px Georgia,serif;letter-spacing:1px;padding:6px 10px 24px;border-bottom:1px solid #ffffff18}.nav{padding-top:18px}.nav button{width:100%;text-align:left;background:none;border:0;color:#cfc7ba;padding:11px 12px;border-radius:10px;cursor:pointer;margin:2px 0}.nav button.active,.nav button:hover{background:#ffffff10;color:#f2d397}.main{padding:24px;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.title{font:700 clamp(25px,3vw,38px) Georgia,serif;margin:4px 0}.user-chip{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 12px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--champ);display:grid;place-items:center;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:6px}.panel{padding:20px;margin-top:14px}.panel h2{font:700 21px Georgia,serif;margin:0 0 14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fffdfa}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;background:var(--champ)}.danger{background:#f6dfdc;color:#8b3029}.ok{background:#e5efdf;color:#42633b}.gold{background:#f1e4c9;color:#77591f}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn-small{padding:8px 10px;background:#f3ede3;border:1px solid var(--line);border-radius:10px;cursor:pointer}.page{display:none}.page.active{display:block}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;z-index:5;width:270px;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head>
<body>
<section id="login" class="login"><div class="login-card card"><div class="brand"><div class="brand-mark">R</div><h1>ROMANO</h1><p>PROPERTY CARE</p></div><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Palavra-passe</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Entrar no sistema</button><div id="loginError" class="error"></div></form></div></section>
<section id="app" class="hidden"><div class="shell"><aside class="side"><div class="brand-mini">ROMANO PROPERTY CARE</div><nav id="nav" class="nav"></nav><button id="logout" class="nav">Sair</button></aside><main class="main"><div class="top"><div><div class="eyebrow" id="roleLabel">Sistema operacional</div><div class="title" id="pageTitle">Resumo</div></div><div class="user-chip"><div class="avatar" id="userAvatar">R</div><div><strong id="userName">—</strong><div class="muted" id="userRole">—</div></div></div></div><div id="pages"></div></main></div></section>
<script>
const SUPABASE_URL='https://dhzptogrzuqreflcnsnb.supabase.co';
const SUPABASE_KEY='sb_publishable_DFmwh4k4-6RWDJnjCRNppA_TFrBkIxN';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const roleMenus={ADMIN:[['dashboard','Resumo'],['operation','Operação em vivo'],['services','Serviços'],['clients','Clientes'],['properties','Propriedades'],['team','Equipa'],['calendar','Calendário'],['materials','Materiais e stock'],['maintenance','Manutenção'],['documents','Documentos e contratos'],['finance','Finanças'],['incidents','Incidências'],['chat','Chat'],['alerts','Alertas'],['audit','Auditoria'],['settings','Configuração']],SUPERVISOR:[['dashboard','Resumo'],['operation','Operação em vivo'],['services','Serviços'],['properties','Propriedades'],['team','Equipa'],['calendar','Calendário'],['materials','Materiais'],['maintenance','Manutenção'],['incidents','Incidências'],['chat','Chat'],['alerts','Alertas']],FUNCIONÁRIO:[['dashboard','Minha jornada'],['services','Meus serviços'],['calendar','Calendário'],['materials','Solicitar material'],['incidents','Incidências'],['chat','Chat']],CLIENTE:[['dashboard','Meu portal'],['properties','Minhas propriedades'],['services','Meus serviços'],['calendar','Calendário'],['incidents','Incidências'],['documents','Documentos'],['finance','Faturas e pagamentos'],['chat','Chat']]};
let session=null,profile=null;const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function roleName(r){return ({ADMIN:'Administrador',SUPERVISOR:'Supervisor','FUNCIONÁRIO':'Funcionário',CLIENTE:'Cliente'})[r]||r}
async function loadProfile(){const {data,error}=await db.from('user_profiles').select('id,display_name,role,active,company_id,employee_id,client_id').eq('id',session.user.id).single();if(error)throw error;if(!data.active)throw new Error('Utilizador desativado.');profile=data}
function menu(){const m=roleMenus[profile.role]||[];$('nav').innerHTML=m.map((x,i)=>`<button data-page="${x[0]}" class="${i===0?'active':''}">${x[1]}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>showPage(b.dataset.page,b.textContent))}
function page(id,body){return `<section id="page-${id}" class="page ${id==='dashboard'?'active':''}">${body}</section>`}
async function render(){
 $('login').classList.add('hidden');$('app').classList.remove('hidden');$('userName').textContent=profile.display_name||session.user.email;$('userRole').textContent=roleName(profile.role);$('roleLabel').textContent=roleName(profile.role);$('userAvatar').textContent=(profile.display_name||'R').trim().charAt(0).toUpperCase();menu();
 const base=`<div class="grid"><div class="stat card"><small>Serviços hoje</small><strong id="kpiJobs">—</strong></div><div class="stat card"><small>Em curso</small><strong id="kpiLive">—</strong></div><div class="stat card"><small>Alertas</small><strong id="kpiAlerts">—</strong></div><div class="stat card"><small>Notificações</small><strong id="kpiNotifs">—</strong></div></div><div class="panel card"><div class="row"><div><h2>Operação</h2><div class="muted">Dados reais do backend, filtrados pelas permissões do utilizador.</div></div><span class="badge gold">RLS ativo</span></div><div id="jobList" class="list" style="margin-top:14px"></div></div>`;
 let bodies={dashboard:base,operation:`<div class="panel card"><h2>Operação em vivo</h2><div id="liveList" class="list"></div></div>`,services:`<div class="panel card"><h2>Serviços</h2><div id="serviceList" class="list"></div></div>`,clients:`<div class="panel card"><h2>Clientes</h2><div class="toolbar"><button class="btn-small">Novo cliente</button><button class="btn-small">Pesquisar</button></div><div id="clientList" class="list" style="margin-top:12px"></div></div>`,properties:`<div class="panel card"><h2>Propriedades</h2><div id="propertyList" class="list"></div></div>`,team:`<div class="panel card"><h2>Equipa e utilizadores</h2><div class="muted">Múltiplos administradores, supervisores, funcionários e clientes são suportados. A criação de novas contas será feita por backend seguro.</div><div id="teamList" class="list" style="margin-top:12px"></div></div>`,calendar:`<div class="panel card"><h2>Calendário</h2><div class="empty">Calendário operacional ligado aos serviços reais.</div></div>`,materials:`<div class="panel card"><h2>Materiais e stock</h2><div class="empty">Stock e pedidos de material.</div></div>`,maintenance:`<div class="panel card"><h2>Manutenção</h2><div class="empty">Ordens preventivas e corretivas ligadas às propriedades e ativos.</div></div>`,documents:`<div class="panel card"><h2>Documentos e contratos</h2><div class="empty">Área segura para contratos, comprovativos e anexos.</div></div>`,finance:`<div class="panel card"><h2>Finanças</h2><div class="empty">Área financeira disponível conforme o perfil. Supervisor não possui acesso.</div></div>`,incidents:`<div class="panel card"><h2>Central de incidências</h2><div class="empty">Incidências ligadas ao serviço e à propriedade.</div></div>`,chat:`<div class="panel card"><h2>Chat operacional</h2><div class="empty">Conversas ligadas a cliente, propriedade e serviço.</div></div>`,alerts:`<div class="panel card"><h2>Alertas e ações</h2><div class="empty">Conflitos, atrasos, stock, contratos e SLA.</div></div>`,audit:`<div class="panel card"><h2>Auditoria</h2><div class="empty">Histórico imutável de ações administrativas.</div></div>`,settings:`<div class="panel card"><h2>Configuração</h2><div class="empty">Módulos, permissões, serviços, estados, checklists e regras.</div></div>`};
 if(profile.role==='CLIENTE') bodies.dashboard=`<div class="panel card"><div class="eyebrow">Portal do cliente</div><h2>Bem-vindo, ${esc(profile.display_name)}</h2><div class="toolbar"><button class="btn-small">Solicitar limpeza</button><button class="btn-small">Solicitar manutenção</button><button class="btn-small">Urgência 24h</button><button class="btn-small">Avançar check-in</button></div></div><div class="grid"><div class="stat card"><small>Minhas propriedades</small><strong id="kpiProps">—</strong></div><div class="stat card"><small>Meus serviços</small><strong id="kpiJobs">—</strong></div><div class="stat card"><small>Faturas</small><strong id="kpiInvoices">—</strong></div><div class="stat card"><small>Incidências</small><strong id="kpiIncidents">—</strong></div></div>`;
 $('pages').innerHTML=Object.entries(bodies).filter(([k])=>roleMenus[profile.role].some(x=>x[0]===k)).map(([k,v])=>page(k,v)).join('');await loadDashboardData()
}
async function loadDashboardData(){try{const {data:jobs}=await db.from('rpc_jobs').select('id,status,service_type,scheduled_at,client_id,property_id,assigned_employee_id,supervisor_id').order('scheduled_at',{ascending:true}).limit(20);const visible=jobs||[];const active=visible.filter(j=>['INICIADO','EM_CURSO','A_CAMINO'].includes(String(j.status||'').toUpperCase()));if($('kpiJobs'))$('kpiJobs').textContent=visible.length;if($('kpiLive'))$('kpiLive').textContent=active.length;const html=visible.map(j=>`<div class="item"><div class="row"><strong>${esc(j.service_type||'Serviço')}</strong><span class="badge ${String(j.status||'').toUpperCase()==='FINALIZADO'?'ok':'gold'}">${esc(j.status||'PLANEADO')}</span></div><div class="muted" style="margin-top:6px">${j.scheduled_at?new Date(j.scheduled_at).toLocaleString('pt-PT'):''}</div></div>`).join('')||'<div class="empty">Sem serviços visíveis.</div>';if($('jobList'))$('jobList').innerHTML=html;if($('liveList'))$('liveList').innerHTML=html;if($('serviceList'))$('serviceList').innerHTML=html}catch(e){console.error(e)}if(profile.role==='ADMIN'||profile.role==='SUPERVISOR'){const {data:clients}=await db.from('rpc_clients').select('id,name,email,active').order('name').limit(50);if($('clientList'))$('clientList').innerHTML=(clients||[]).map(c=>`<div class="item"><div class="row"><strong>${esc(c.name)}</strong><span class="badge ${c.active?'ok':'danger'}">${c.active?'Ativo':'Inativo'}</span></div><div class="muted">${esc(c.email||'')}</div></div>`).join('')||'<div class="empty">Sem clientes.</div>'}if(profile.role==='CLIENTE'){const {data:props}=await db.from('rpc_properties').select('id,name,address').eq('client_id',profile.client_id).limit(50);if($('kpiProps'))$('kpiProps').textContent=(props||[]).length;if($('propertyList'))$('propertyList').innerHTML=(props||[]).map(p=>`<div class="item"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.address||'')}</div></div>`).join('')||'<div class="empty">Nenhuma propriedade.</div>'}}
function showPage(id,title){$('pages').querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const p=$('page-'+id);if(p)p.classList.add('active');$('pageTitle').textContent=title;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id))}
async function start(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!session)return;try{await loadProfile();await render()}catch(e){console.error(e);await db.auth.signOut();$('loginError').textContent=e.message}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return}session=data.session;try{await loadProfile();await render()}catch(err){$('loginError').textContent=err.message;await db.auth.signOut()}};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.onAuthStateChange((_event,s)=>{session=s});start();
</script></body></html>
