<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROMANO PROPERTY CARE — Funcionário</title>
</head>
<body>
<div id="loading" style="font-family:Arial,sans-serif;padding:30px;text-align:center;color:#6b5a43">Carregando área do funcionário…</div>
<script>
(async function(){
  try{
    const r=await fetch('/index.html?employee-source='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Não foi possível carregar o sistema.');
    let html=await r.text();
    html=html.replace(/<!-- ROMANO_AUTH_PROFILE_SYNC_V3 -->[\s\S]*?<\/script>/gi,'');
    html=html.replace(/<!-- ROMANO_AUTH_PROFILE_SYNC_V1 -->[\s\S]*?<\/script>/gi,'');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Erro ao carregar o sistema. Tente novamente.';
    console.error('ROMANO employee loader',e);
  }
})();
</script>
</body>
</html>
