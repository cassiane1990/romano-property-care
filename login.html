<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROMANO PROPERTY CARE · Acceso</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--espresso:#211b16;--brown:#5d4635;--gold:#b7893f;--gold2:#d4b06a;--cream:#f7f2e9;--white:#fffdf9;--line:#e7dccb;--muted:#7c7065;--red:#a94c43}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;margin:0}body{min-height:100vh;background:radial-gradient(circle at 20% 20%,#463a2a 0,#211d19 42%,#171513 100%);color:#30261f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(390px,94vw);background:var(--white);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 25px 70px #0008}.brand{text-align:center;border-bottom:1px solid var(--line);padding-bottom:18px}.r{font:64px Georgia;color:var(--gold2);line-height:.8;position:relative}.r:before{content:'♛';position:absolute;font-size:20px;top:-16px;left:50%;transform:translateX(-50%)}h1{font:500 21px Georgia;letter-spacing:6px;margin:14px 0 3px}.small{letter-spacing:3px;color:#9a8a77;font-size:11px}.sub{margin-top:7px;color:#b09c83;font-size:10px;letter-spacing:2px}.title{font:600 22px Georgia;text-align:center;margin:21px 0 7px}.hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.45}.fieldwrap{margin-top:14px}.label{display:block;font-size:10px;font-weight:900;color:#776858;letter-spacing:1px;margin-bottom:6px}.field{width:100%;border:1px solid #ddcfbc;background:#fffdfa;border-radius:10px;padding:11px;outline:0;font:inherit}.field:focus{border-color:var(--gold)}button{width:100%;border:1px solid #ddcfbc;background:#fffaf2;color:var(--brown);padding:11px;border-radius:11px;font-weight:850;cursor:pointer}.primary{margin-top:15px;background:linear-gradient(135deg,var(--gold),#966a2b);color:#fff;border-color:transparent}.primary:disabled{opacity:.6;cursor:wait}.error{display:none;margin-top:12px;padding:9px;border-radius:9px;background:#f3dcd9;color:#933e38;font-size:11px;font-weight:700;text-align:center}.foot{text-align:center;margin-top:16px;color:#9a8b7b;font-size:9px;letter-spacing:1.3px}.forgot{display:block;text-align:center;margin-top:13px;color:#8f641d;font-size:11px;text-decoration:none}.note{display:none;margin-top:10px;padding:9px;border-radius:9px;background:#f5ead9;color:#756b5e;font-size:11px;text-align:center}@media(max-width:520px){body{padding:14px}.card{width:100%;max-width:390px;padding:22px 19px}.field{font-size:16px;min-height:46px}.primary{min-height:46px}}</style></head><body><main class="card"><div class="brand"><div class="r">R</div><h1>ROMANO</h1><div class="small">PROPERTY CARE</div><div class="sub">EXCELENCIA EN CADA DETALLE</div></div><div class="title">Bienvenido</div><div class="hint">Accede a tu espacio profesional de ROMANO PROPERTY CARE.</div><div id="error" class="error"></div><div id="note" class="note"></div><form id="form"><div class="fieldwrap"><label class="label">CORREO ELECTRÓNICO</label><input id="email" class="field" type="email" autocomplete="username" required placeholder="correo@romano.es"></div><div class="fieldwrap"><label class="label">CONTRASEÑA</label><input id="password" class="field" type="password" autocomplete="current-password" required placeholder="Introduce tu contraseña"></div><button id="loginBtn" class="primary" type="submit">Entrar al sistema</button></form><a href="#" id="forgot" class="forgot">¿Olvidaste tu contraseña?</a><div class="foot">ESPAÑA · PORTUGAL · ROMANO PROPERTY CARE</div></main><script>const SUPABASE_URL='https://dhzptogrzuqreflcnsnb.supabase.co';const SUPABASE_KEY='sb_publishable_DFmwh4k4-6RWDJnjCRNppA_TFrBkIxN';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function clearLocalIdentity(){['romano_role','romano_user','romano_auth_user_id','romano_display_name','romano_login_ok_at'].forEach(k=>localStorage.removeItem(k));}function showError(t){$('error').textContent=t;$('error').style.display='block';$('note').style.display='none'}function showNote(t){$('note').textContent=t;$('note').style.display='block';$('error').style.display='none'}async function profileFor(userId){const {data,error}=await sb.from('user_profiles').select('role,display_name,active,username,employee_id,client_id').eq('id',userId).maybeSingle();if(error)throw error;return data}$('form').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;clearLocalIdentity();$('loginBtn').disabled=true;showNote('Verificando acceso...');try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const p=await profileFor(data.user.id);if(!p||p.active===false){await sb.auth.signOut();clearLocalIdentity();throw new Error('Cuenta inactiva o sin perfil autorizado.')}localStorage.setItem('romano_role',p.role||'FUNCIONÁRIO');localStorage.setItem('romano_user',p.username||email);localStorage.setItem('romano_auth_user_id',data.user.id);localStorage.setItem('romano_display_name',p.display_name||data.user.email||'');localStorage.setItem('romano_login_ok_at',String(Date.now()));await new Promise(r=>setTimeout(r,150));window.location.replace(p.role==='ADMIN'?'/index.html':'/index-funcionario.html?employee=1&v=20260916')}catch(err){console.error('ROMANO LOGIN',err);let t=err.message||'No fue posible entrar.';if(/invalid login credentials/i.test(t))t='E-mail o contraseña incorrectos.';if(/email not confirmed/i.test(t))t='Confirma primero el e-mail de la cuenta.';showError(t)}finally{$('loginBtn').disabled=false}});$('forgot').onclick=async e=>{e.preventDefault();const email=$('email').value.trim();if(!email){showError('Escribe primero tu e-mail para recibir el enlace de recuperación.');return}showNote('Enviando enlace de recuperación...');try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});if(error)throw error;showNote('Si la cuenta existe, recibirás el enlace de recuperación por e-mail.')}catch(err){showError(err.message||'No fue posible solicitar la recuperación.')}};</script></body></html>
