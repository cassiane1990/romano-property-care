<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROMANO PROPERTY CARE · Acceso</title><style>:root{--espresso:#2f2118;--brown:#5d4635;--gold:#b7893f;--gold2:#d4b06a;--cream:#f7f2e9;--white:#fffdf9;--line:#e7dccb;--muted:#7c7065}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 20%,#463a2a 0,#211d19 42%,#171513 100%);color:#30261f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(390px,94vw);background:var(--white);border:1px solid #e7dccb;border-radius:24px;padding:25px;box-shadow:0 25px 70px #0008}.brand{text-align:center;border-bottom:1px solid var(--line);padding-bottom:18px}.r{font:64px Georgia;color:var(--gold2);line-height:.8;position:relative}.r:before{content:'♛';position:absolute;font-size:20px;top:-16px;left:50%;transform:translateX(-50%)}h1{font:500 21px Georgia;letter-spacing:6px;margin:14px 0 3px}.small{letter-spacing:3px;color:#9a8a77;font-size:11px}.sub{margin-top:7px;color:#b09c83;font-size:10px;letter-spacing:2px}.title{font:600 22px Georgia;text-align:center;margin:21px 0 7px}.hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.45}.fieldwrap{margin-top:14px}.label{display:block;font-size:10px;font-weight:900;color:#776858;letter-spacing:1px;margin-bottom:6px}.field{width:100%;border:1px solid #ddcfbc;background:#fffdfa;border-radius:10px;padding:11px;outline:0}.field:focus{border-color:var(--gold)}button{width:100%;border:1px solid #ddcfbc;background:#fffaf2;color:var(--brown);padding:11px;border-radius:11px;font-weight:850;cursor:pointer}.primary{margin-top:15px;background:linear-gradient(135deg,var(--gold),#966a2b);color:white;border-color:transparent}.tests{margin-top:15px;padding:12px;border:1px solid #dfd1bd;border-radius:14px;background:#fffaf3}.testsTitle{font-size:10px;letter-spacing:1.2px;font-weight:900;color:#7a7167;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid button{font-size:11px;min-height:43px}.error{display:none;margin-top:12px;padding:9px;border-radius:9px;background:#f3dcd9;color:#933e38;font-size:11px;font-weight:700}.foot{text-align:center;margin-top:16px;color:#9a8b7b;font-size:9px;letter-spacing:1.3px}</style></head><body><main class="card"><div class="brand"><div class="r">R</div><h1>ROMANO</h1><div class="small">PROPERTY CARE</div><div class="sub">EXCELENCIA EN CADA DETALLE</div></div><div class="title">Bienvenido</div><div class="hint">Accede a tu espacio profesional de ROMANO PROPERTY CARE.</div><div id="error" class="error"></div><form id="form"><div class="fieldwrap"><label class="label">CORREO ELECTRÓNICO</label><input id="email" class="field" type="email" autocomplete="username" required placeholder="correo@romano.es"></div><div class="fieldwrap"><label class="label">CONTRASEÑA</label><input id="password" class="field" type="password" autocomplete="current-password" required placeholder="Introduce tu contraseña"></div><button class="primary" type="submit">Entrar al sistema</button></form><div class="tests"><div class="testsTitle">ACCESOS DE PRUEBA · MODO DESARROLLO</div><div class="grid"><button type="button" onclick="test('admin@romano.test','Admin123','ADMIN','ROMANO / ADMIN')">ADMIN · Rita</button><button type="button" onclick="test('carlos@romano.test','Super123','SUPERVISOR','Carlos Martín')">SUPERVISOR · Carlos</button><button type="button" onclick="test('ana@romano.test','Func123','FUNCIONARIO','Ana López')">FUNCIONARIO · Ana</button><button type="button" onclick="test('gabi@romano.test','Client123','CLIENTE','Gabi')">CLIENTE · Gabi</button></div></div><div class="foot">ESPAÑA · PORTUGAL · ROMANO PROPERTY CARE</div></main><script>const A={'admin@romano.test':['Admin123','ADMIN','ROMANO / ADMIN'],'carlos@romano.test':['Super123','SUPERVISOR','Carlos Martín'],'ana@romano.test':['Func123','FUNCIONARIO','Ana López'],'gabi@romano.test':['Client123','CLIENTE','Gabi']};function go(email,password,role,name){sessionStorage.setItem('RPC_V78_SESSION',JSON.stringify({email,password,role,name}));location.href='/index.html'}function test(email,password,role,name){go(email,password,role,name)}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(A[email]&&A[email][0]===password){go(email,password,A[email][1],A[email][2]);return}document.getElementById('error').textContent='Credenciales no válidas. Para la prueba utilice uno de los cuatro accesos de prueba.';document.getElementById('error').style.display='block'})</script></body></html>
